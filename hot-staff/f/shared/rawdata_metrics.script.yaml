summary: Raw Data API Download Metrics
description: ''
lock: '!inline f/shared/rawdata_metrics.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - aws
    - logs_path
    - year
    - quarter
    - to_year
    - to_quarter
  properties:
    aws:
      type: object
      description: ''
      default: null
      format: resource-aws
    logs_path:
      type: string
      description: ''
      default: hot-server-access-logs/670261699094/us-east-1/production-raw-data-api
      originalType: string
    quarter:
      type: string
      description: ''
      default: null
      enum:
        - Q1
        - Q2
        - Q3
        - Q4
      originalType: enum
    to_quarter:
      type: string
      description: Optional end of a range, defaults to quarter
      default: null
      enum:
        - Q1
        - Q2
        - Q3
        - Q4
      originalType: enum
    to_year:
      type: integer
      description: Optional end of a range, defaults to year
      default: null
    year:
      type: integer
      description: Leave year and quarter empty for the previous quarter
      default: null
  required:
    - aws
tag: osm-export-small
